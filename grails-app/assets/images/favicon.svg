<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="steakOS">
  <!-- Steak-shaped favicon: readable at tab size -->
  <defs>
    <linearGradient id="meat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c45c3e"/>
      <stop offset="45%" stop-color="#8b2e1f"/>
      <stop offset="100%" stop-color="#5c1a12"/>
    </linearGradient>
    <linearGradient id="fat" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0d9a8"/>
      <stop offset="100%" stop-color="#e8c48a"/>
    </linearGradient>
  </defs>
  <!-- Plate / soft disc for contrast on light & dark tabs -->
  <circle cx="16" cy="16" r="15" fill="#1a1410"/>
  <!-- T-bone steak body -->
  <ellipse cx="16.5" cy="17" rx="11" ry="9" fill="url(#meat)" transform="rotate(-18 16.5 17)"/>
  <!-- Fat marbling edge -->
  <path fill="url(#fat)" opacity="0.9" d="M8.2 12.5c2.2-2.8 6-3.8 9.4-2.6 1.2.4 2.2 1.1 2.8 2-2.5-1.2-5.8-.8-8.2 1.1-1.3 1-2.2 2.4-2.6 3.9-.6-1.6-.9-2.9-1.4-4.4z"/>
  <!-- T-bone -->
  <path fill="#f5ebe0" stroke="#d4c4b0" stroke-width="0.4" d="M13.2 10.5c.4-.2 1.1-.1 1.5.3l5.8 6.6c.3.35.25.9-.15 1.15l-1.1.7c-.4.25-.95.15-1.2-.25l-5.5-6.9c-.3-.4-.15-1 .65-1.6z"/>
  <ellipse cx="13.8" cy="11.2" rx="2.1" ry="1.7" fill="#f5ebe0" transform="rotate(-35 13.8 11.2)"/>
  <!-- Grill marks -->
  <g stroke="#3d120c" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <path d="M10 14.5c2.5 1.2 5 1.5 8.5.6"/>
    <path d="M9.5 17.2c2.8 1.1 5.5 1.3 9 .4"/>
    <path d="M10.2 19.8c2.4.9 5 1.1 8.2.3"/>
  </g>
  <!-- Small highlight -->
  <ellipse cx="12" cy="14" rx="2.2" ry="1.2" fill="#e07a5f" opacity="0.35" transform="rotate(-20 12 14)"/>
</svg>
