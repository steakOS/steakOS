---
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    codegen:
        defaultPackage: steakos
    profile: web

---
grails:
    mime:
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                scriptlet: html

---
# Field encryption for sensitive User attributes (nsec, npub, bunker). Override in production.
steakos:
    # Operator/dev harness flag — OFF by default on install. Enable only on lab hosts
    # (STEAKOS_DEVELOPMENT_MODE=true). Gates the Coder agent and AI:* task workflow.
    developmentMode: ${STEAKOS_DEVELOPMENT_MODE:false}
    encryption:
        password: ${STEAKOS_FIELD_ENCRYPTION_PASSWORD:steakos-dev-only-change-me!!}
        # Hex-encoded salt required by Spring Encryptors (min 8 bytes → 16 hex chars)
        salt: ${STEAKOS_FIELD_ENCRYPTION_SALT:a1b2c3d4e5f60718}
    frontend:
        url: ${STEAKOS_FRONTEND_URL:http://localhost:9001}
    # Product release stamp — docs/versions/VERSIONS.md (V1–V7)
    # Software V comes from Gradle version (info.app.version); stay on 0.x until SBM GA (V6).
    version:
        productLine: ${STEAKOS_PRODUCT_LINE:SBM}
        releaseMajor: ${STEAKOS_RELEASE_MAJOR:1}
        releaseMinor: ${STEAKOS_RELEASE_MINOR:0}
        # Optional fixed build id; empty → generated at process start (UTC yyyyMMdd'T'HHmm)
        buildId: ${STEAKOS_BUILD_ID:}
    # Observability (OBS Phase 0–2) — see steakOS-dev/observability/
    observability:
        enabled: true
        health:
            # Optional absolute URL; Phase 1 does not probe (avoids hanging ready)
            btcpay: ${STEAKOS_OBS_BTCPAY_URL:}
            nostrRelay: ${STEAKOS_OBS_NOSTR_RELAY_URL:}
            # Optional marker file written by backup success hook (OBS-09)
            backupMarker: ${STEAKOS_OBS_BACKUP_MARKER:}
        ui:
            grafanaUrl: ${STEAKOS_OBS_GRAFANA_URL:http://umbrel.local:3030}
            uptimeKumaUrl: ${STEAKOS_OBS_KUMA_URL:http://umbrel.local:8385}
        metrics:
            prometheus:
                enabled: true
                path: /api/ops/metrics
    # Bitcoin payment rails (OI-F27 / BTCPAY-INTEGRATION-CONCEPT) — non-secret defaults only
    payments:
        http-timeout-ms: ${STEAKOS_PAYMENTS_HTTP_TIMEOUT_MS:15000}
        reconcile-cron: ${STEAKOS_PAYMENTS_RECONCILE_CRON:0 */5 * * * *}
        webhook-max-skew-sec: ${STEAKOS_PAYMENTS_WEBHOOK_SKEW_SEC:300}
        # Allow private/link-local BTCPay URLs only in local dev
        url-allow-private: ${STEAKOS_PAYMENTS_URL_ALLOW_PRIVATE:false}

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect
    username: ${STEAKOS_DB_USER:steakos}
    password: ${STEAKOS_DB_PASSWORD:steakos}
    # Shared pool defaults; production tightens these further
    properties:
        jmxEnabled: true
        initialSize: 2
        maxActive: 25
        minIdle: 2
        maxIdle: 10
        maxWait: 10000
        maxAge: 600000
        timeBetweenEvictionRunsMillis: 5000
        minEvictableIdleTimeMillis: 60000
        validationQuery: SELECT 1
        validationQueryTimeout: 3
        validationInterval: 15000
        testOnBorrow: true
        testWhileIdle: true
        testOnReturn: false
        jdbcInterceptors: ConnectionState
        defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED

# Trust X-Forwarded-* from Vite (or reverse proxy) so login redirects use the browser host, not 127.0.0.1:6060
# Content rail FILE uploads (ContentBlobService.HARD_MAX = 25 MiB). Grails default is 128000 bytes.
server:
    forward-headers-strategy: framework
    tomcat:
        max-http-form-post-size: 31457280
        max-swallow-size: 31457280
grails:
    controllers:
        upload:
            maxFileSize: 26214400
            maxRequestSize: 31457280
spring:
    servlet:
        multipart:
            max-file-size: 25MB
            max-request-size: 30MB
            enabled: true

# Grails environments: development (dev), test, production (prod)
# Ports: dev 6060 | test 7070 | prod 9090
# Aliases "dev" and "prod" map to the same settings as development / production.
environments:
    development: &dev
        server:
            port: 6060
            forward-headers-strategy: framework
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://${STEAKOS_DB_HOST:localhost}:${STEAKOS_DB_PORT:5432}/steakos_dev
    dev: *dev
    test:
        server:
            port: 7070
            forward-headers-strategy: framework
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://${STEAKOS_DB_HOST:localhost}:${STEAKOS_DB_PORT:5432}/steakos_test
    production: &prod
        server:
            port: 9090
            forward-headers-strategy: framework
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://${STEAKOS_DB_HOST:localhost}:${STEAKOS_DB_PORT:5432}/steakos_prod
            properties:
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
    prod: *prod
