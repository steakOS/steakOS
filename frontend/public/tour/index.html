<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteakOS Onboarding Tour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        html, body { height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse 70% 45% at 50% -8%, rgba(232, 160, 74, 0.10), transparent 60%),
                #0c0b09;
        }
        .heading { font-family: 'Space Grotesk', sans-serif; }
        .progress-bar { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .choice-card { transition: border-color 0.2s, background 0.2s; }
        .choice-card:hover { border-color: #e8a04a; background: #221c14; }
        .tour-shell {
            display: flex;
            flex-direction: column;
            width: min(1040px, calc(100vw - 48px));
            max-height: calc(100vh - 48px);
            box-sizing: border-box;
            padding: 28px 36px 20px;
            background: #14120f;
            border: 1px solid #322b22;
            border-radius: 22px;
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
        }
        .tour-header {
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: auto minmax(180px, 1fr) auto;
            align-items: center;
            gap: 22px;
            margin-bottom: 18px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a241c;
        }
        .tour-progress { min-width: 0; }
        .tour-progress-track {
            height: 6px;
            background: #2a241c;
            border-radius: 999px;
            overflow: hidden;
        }
        .tour-progress-meta { margin-top: 6px; }
        #content-area {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
        }
        .tour-nav {
            flex: 0 0 auto;
            margin-top: 8px;
            padding-top: 14px;
            border-top: 1px solid #2a241c;
        }
        .tour-page { margin-bottom: 0; }
        .tour-title-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.1rem;
        }
        .tour-title-row .tour-icon { font-size: 1.85rem; line-height: 1; }
        .tour-title-row .tour-title { font-size: 1.85rem; font-weight: 600; letter-spacing: -0.02em; }
        .tour-examples { margin: 0 0 1.1rem; }
        .tour-examples-label { margin-bottom: 0.45rem; letter-spacing: 0.08em; }
        .tour-examples-list { display: flex; flex-direction: column; gap: 0.45rem; }
        .tour-example { font-size: 1.2rem; line-height: 1.45; margin: 0; }
        .tour-body { font-size: 1.125rem; line-height: 1.6; margin: 0; max-width: 68ch; }
        .tour-section { margin-top: 1.15rem; }
        .tour-section-label { margin-bottom: 0.5rem; letter-spacing: 0.06em; }
        .mermaid { overflow-x: auto; }
        .acronym-letter {
            color: #fbbf24;
            font-weight: 700;
            font-size: 1.1em;
            letter-spacing: 0.02em;
        }
        @media (max-width: 800px) {
            body { align-items: stretch; background: #0c0b09; }
            .tour-shell {
                width: 100%;
                max-height: 100vh;
                height: 100vh;
                border: 0;
                border-radius: 0;
                box-shadow: none;
                padding: 0.75rem 0.9rem;
            }
            .tour-header { grid-template-columns: 1fr; gap: 10px; }
            .tour-example { font-size: 1.05rem; }
            .tour-body { font-size: 1rem; }
            .tour-title-row .tour-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body class="text-zinc-100">
    <div class="tour-shell">
        <div class="tour-header">
            <div class="flex items-center gap-3">
                <img src="/logo_small.png" alt="" width="40" height="40" class="rounded-xl object-cover" style="background:#0d1015" aria-hidden="true"/>
                <div>
                    <div class="heading text-xl font-bold leading-tight">steakOS</div>
                    <div class="text-[11px] text-zinc-500 leading-tight">Onboarding tour</div>
                </div>
            </div>
            <div class="tour-progress">
                <div class="tour-progress-track">
                    <div id="progress-bar" class="progress-bar h-full bg-amber-500 w-0"></div>
                </div>
                <div class="tour-progress-meta flex justify-between gap-3">
                    <div id="progress-text" class="text-zinc-300 text-sm font-medium leading-tight">Section 1/11</div>
                    <div id="section-detail" class="text-[12px] text-zinc-500 leading-tight text-right"></div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="/setup" class="text-xs px-3 py-1.5 rounded-xl border border-zinc-700 hover:border-amber-500 text-zinc-300 hover:text-amber-400 whitespace-nowrap">Setup wizard</a>
                <a href="/dashboard" data-dashboard-link hidden class="text-xs px-3 py-1.5 rounded-xl border border-zinc-700 hover:border-amber-500 text-zinc-300 hover:text-amber-400 whitespace-nowrap">App dashboard</a>
            </div>
        </div>

        <div id="content-area"></div>

        <!-- Navigation sits under the text, not at the bottom of the monitor -->
        <div class="tour-nav flex justify-between items-center gap-3">
            <button onclick="prevStep()" class="px-5 py-2 border border-zinc-700 hover:bg-zinc-900 rounded-2xl flex items-center gap-2 font-medium text-sm">← Previous</button>
            <div class="flex items-center gap-2">
                <button onclick="skipSection()" id="btn-skip" class="hidden px-4 py-2 border border-zinc-700 hover:bg-zinc-900 rounded-2xl font-medium text-sm">Skip this section</button>
                <button onclick="nextStep()" class="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-black font-semibold rounded-2xl flex items-center gap-2 text-sm">Next →</button>
            </div>
        </div>
    </div>

    <script>
        let currentSectionIndex = 0;
        let currentPage = 0;
        let currentSectionData = {};
        let currentTemplateData = null;
        let isInTemplateMode = false;
        let currentTemplateName = "";
        let tourLang = 'en';

        const LOCALE_KEY = 'steakos.ui.locale';
        const LOCALE_OPTIONS = [
            { code: 'en_US', label: 'English (United States)' },
            { code: 'en_SG', label: 'English (Singapore)' },
            { code: 'de_DE', label: 'Deutsch (Deutschland)' },
            { code: 'de_AT', label: 'Deutsch (Österreich)' },
            { code: 'de_CH', label: 'Deutsch (Schweiz)' },
            { code: 'es_ES', label: 'Español (España)' },
        ];

        function langFromLocale(code) {
            if (!code) return 'en';
            const c = String(code).toLowerCase();
            if (c.startsWith('de')) return 'de';
            if (c.startsWith('es')) return 'es';
            return 'en';
        }

        function tourChrome(en, de, es) {
            if (tourLang === 'de') return de;
            if (tourLang === 'es') return es;
            return en;
        }

        function sectionDisplayName(section) {
            if (tourLang === 'de') return section.nameDe || section.name;
            if (tourLang === 'es') return section.nameEs || section.name;
            return section.name;
        }

        function initTourLang() {
            try {
                const stored = localStorage.getItem(LOCALE_KEY);
                if (stored) tourLang = langFromLocale(stored);
            } catch (e) {}
        }
        initTourLang();

        const sections = [
            { file: "locale.json", name: "Language", nameDe: "Sprache", nameEs: "Idioma" },
            { file: "welcome.json", name: "Welcome", nameDe: "Willkommen", nameEs: "Bienvenida" },
            { file: "journey.json", name: "Your Journey", nameDe: "Ihre Reise", nameEs: "Su recorrido" },
            { file: "processes.json", name: "Business Processes", nameDe: "Prozesse", nameEs: "Procesos" },
            { file: "apqc.json", name: "APQC Framework", nameDe: "APQC", nameEs: "APQC" },
            { file: "ai.json", name: "AI Support", nameDe: "KI", nameEs: "IA" },
            { file: "bitcoin.json", name: "Bitcoin", nameDe: "Bitcoin", nameEs: "Bitcoin" },
            { file: "nostr.json", name: "Nostr", nameDe: "Nostr", nameEs: "Nostr" },
            { file: "core-concepts.json", name: "Core Concepts", nameDe: "Kernkonzepte", nameEs: "Conceptos clave" },
            { file: "templates.json", name: "Choose Template", nameDe: "Vorlage", nameEs: "Plantilla" },
            { file: "architecture.json", name: "Architecture", nameDe: "Architektur", nameEs: "Arquitectura" },
            { file: "finish.json", name: "Finish", nameDe: "Abschluss", nameEs: "Final" }
        ];

        function sectionFile(file) {
            return tourLang + '/' + file;
        }

        async function loadSection(index) {
            const section = sections[index];
            try {
                let res = await fetch(sectionFile(section.file));
                if (!res.ok) res = await fetch(section.file);
                currentSectionData = await res.json();
                currentPage = 0;
                isInTemplateMode = false;
                currentTemplateName = "";
                renderPage();
                // chrome language
                const nextBtn = document.querySelector('button[onclick="nextStep()"]');
                const prevBtn = document.querySelector('button[onclick="prevStep()"]');
                const skipBtn = document.getElementById('btn-skip');
                if (nextBtn) nextBtn.innerHTML = tourChrome('Next →', 'Weiter →', 'Siguiente →');
                if (prevBtn) prevBtn.innerHTML = tourChrome('← Previous', '← Zurück', '← Anterior');
                if (skipBtn) skipBtn.textContent = tourChrome('Skip this section', 'Abschnitt überspringen', 'Omitir esta sección');
            } catch (e) {
                console.error('Failed to load', section.file, e);
            }
        }

        function formatText(text) {
            if (!text) return '';
            // Tighten blank lines so pages fit ~1024px height more often
            text = text.replace(/\n{3,}/g, '\n\n');
            // {{S}}overeign → highlighted acronym letter (PDR-002 backronym)
            text = text.replace(/\{\{([A-Za-z])\}\}/g, '<span class="acronym-letter">$1</span>');
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*([^*]+?)\*/g, '<em>$1</em>');
            return text;
        }

        function updateProgress() {
            const totalSections = sections.length;
            const sectionLabel = tourChrome('Section', 'Abschnitt', 'Sección');
            const pageOf = tourChrome('Page', 'Seite', 'Página');
            const pageOfMid = tourChrome('of', 'von', 'de');
            const templateWord = tourChrome('Template', 'Vorlage', 'Plantilla');
            document.getElementById('progress-bar').style.width = `${((currentSectionIndex + 1) / totalSections) * 100}%`;
            document.getElementById('progress-text').textContent = `${sectionLabel} ${currentSectionIndex + 1}/${totalSections}`;

            let detailText = "";
            if (isInTemplateMode && currentTemplateName) {
                const total = currentTemplateData.pages ? currentTemplateData.pages.length : 1;
                detailText = `${currentTemplateName} ${templateWord} • ${pageOf} ${currentPage + 1} ${pageOfMid} ${total}`;
            } else {
                const name = currentSectionData.title || sectionDisplayName(sections[currentSectionIndex]);
                const total = currentSectionData.pages ? currentSectionData.pages.length : 1;
                detailText = `${name} • ${pageOf} ${currentPage + 1} ${pageOfMid} ${total}`;
            }
            document.getElementById('section-detail').textContent = detailText;
        }

        function renderPage() {
            const area = document.getElementById('content-area');
            let page;

            if (isInTemplateMode && currentTemplateData && currentTemplateData.pages) {
                page = currentTemplateData.pages[currentPage];
            } else {
                page = currentSectionData.pages ? currentSectionData.pages[currentPage] : {title: "Page", text: "Content loaded!"};
            }

            let examplesHtml = '';
            if (page.examples && page.examples.length > 0) {
                // No bordered cards — examples sit above body text at a slightly larger size
                examplesHtml = `
                    <div class="tour-examples">
                        <div class="tour-examples-label text-amber-400 text-xs font-medium tracking-wide">${tourChrome('💡 EXAMPLES', '💡 BEISPIELE', '💡 EJEMPLOS')}</div>
                        <div class="tour-examples-list">
                            ${page.examples.map(ex => `
                                <p class="tour-example text-zinc-100 font-medium whitespace-pre-line">${formatText(ex)}</p>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            let choicesHtml = '';
            if (page.localePicker) {
                let current = 'en_US';
                try { current = localStorage.getItem(LOCALE_KEY) || current; } catch (e) {}
                choicesHtml = `
                    <div class="tour-section">
                        <div class="tour-section-label text-amber-400 text-xs font-medium">${tourChrome('Choose locale', 'Locale wählen', 'Elegir idioma')}</div>
                        <select id="tour-locale-select" class="w-full max-w-md bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-base"
                            onchange="onTourLocaleChange(this.value)">
                            ${LOCALE_OPTIONS.map(o => `<option value="${o.code}" ${o.code === current ? 'selected' : ''}>${o.label}</option>`).join('')}
                        </select>
                        <p class="text-zinc-500 text-xs mt-2">${tourChrome('Stored in the browser and applied after login.', 'Wird im Browser gespeichert und nach dem Login übernommen.', 'Se guarda en el navegador y se aplica tras iniciar sesión.')}</p>
                    </div>
                `;
            } else if (page.choices && page.choices.length > 0) {
                choicesHtml = `
                    <div class="tour-section">
                        <div class="tour-section-label text-amber-400 text-xs font-medium">${tourChrome('Make your choice', 'Treffen Sie Ihre Wahl', 'Elija una opción')}</div>
                        <div class="grid md:grid-cols-2 gap-3">
                            ${page.choices.map((choice, i) => `
                                <div onclick="makeChoice(${i})" class="choice-card cursor-pointer bg-zinc-900/80 p-4 rounded-2xl border border-zinc-700 text-sm leading-snug">
                                    ${formatText(choice)}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            let mermaidHtml = '';
            if (page.mermaid) {
                mermaidHtml = `
                    <div class="tour-section">
                        <div class="tour-section-label text-amber-400 text-xs font-medium">${tourChrome('📊 VISUAL OVERVIEW', '📊 ÜBERSICHT', '📊 RESUMEN VISUAL')}</div>
                        <div class="mermaid bg-zinc-900 p-3 rounded-2xl border border-zinc-700 text-sm">
                            ${page.mermaid}
                        </div>
                    </div>
                `;
            }

            const html = `
                <div class="tour-page">
                    <div class="tour-title-row">
                        <span class="tour-icon">${page.icon || '📍'}</span>
                        <span class="tour-title">${page.title}</span>
                    </div>
                    ${examplesHtml}
                    <div class="tour-body text-zinc-300 whitespace-pre-line">${formatText(page.text || '')}</div>
                    ${mermaidHtml}
                    ${choicesHtml}
                </div>
            `;
            area.innerHTML = html;

            if (page.mermaid) {
                mermaid.init(undefined, document.querySelectorAll('.mermaid'));
            }

            updateProgress();

            const skipBtn = document.getElementById('btn-skip');
            skipBtn.classList.toggle('hidden', !page.canSkip);
        }

        async function onTourLocaleChange(code) {
            try { localStorage.setItem(LOCALE_KEY, code); } catch (e) {}
            const nextLang = langFromLocale(code);
            if (nextLang !== tourLang) {
                tourLang = nextLang;
                await loadSection(currentSectionIndex);
            }
        }

        async function makeChoice(choiceIndex) {
            const page = currentSectionData.pages[currentPage];
            if (page.contentchoice && page.contentchoice[choiceIndex]) {
                const chosenFile = page.contentchoice[choiceIndex];
                try {
                    // Remember for config wizard handshake (SetupWizard reads preferredTemplate)
                    const tierCodes = page.tierCodes || [];
                    if (tierCodes[choiceIndex]) {
                        try {
                            localStorage.setItem('steakos.preferredTemplate', tierCodes[choiceIndex]);
                        } catch (e) { /* private mode */ }
                    }
                    // Prefer language-specific path (e.g. de/templates/iron.json), then root fallback
                    let res = await fetch(sectionFile(chosenFile));
                    if (!res.ok) res = await fetch(chosenFile);
                    if (!res.ok) throw new Error('template not found');
                    currentTemplateData = await res.json();
                    isInTemplateMode = true;
                    currentPage = 0;
                    currentTemplateName = page.choices[choiceIndex].split(":")[0].trim();
                    renderPage();
                } catch (e) {
                    alert(tourChrome('Failed to load ', 'Konnte nicht laden: ', 'No se pudo cargar: ') + chosenFile);
                }
            } else {
                nextStep();
            }
        }

        function nextStep() {
            if (isInTemplateMode) {
                const totalPages = currentTemplateData.pages ? currentTemplateData.pages.length : 1;
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    renderPage();
                    return;
                }
            }

            const totalPages = currentSectionData.pages ? currentSectionData.pages.length : 1;
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
            } else if (currentSectionIndex < sections.length - 1) {
                currentSectionIndex++;
                loadSection(currentSectionIndex);
            } else {
                showTourFinished();
            }
        }

        async function setupIsComplete() {
            try {
                const res = await fetch('/api/setup/status', { credentials: 'same-origin' });
                if (!res.ok) return false;
                const data = await res.json();
                return !!(data && data.setupComplete);
            } catch (e) {
                return false;
            }
        }

        function applyDashboardLinks(show) {
            document.querySelectorAll('[data-dashboard-link]').forEach((el) => {
                el.hidden = !show;
            });
        }

        async function showTourFinished() {
            const showDash = await setupIsComplete();
            applyDashboardLinks(showDash);
            const dash = showDash
                ? '<a href="/dashboard" data-dashboard-link class="px-6 py-2 border border-zinc-600 hover:bg-zinc-900 rounded-2xl font-medium text-sm">Go to dashboard</a>'
                : '';
            const area = document.getElementById('content-area');
            area.innerHTML = `
                <div class="text-center py-6">
                    <div class="text-4xl mb-3">🎉</div>
                    <h2 class="heading text-2xl font-bold mb-2">Tour complete</h2>
                    <p class="text-zinc-400 text-sm mb-5 max-w-xl mx-auto leading-snug">
                        Continue in steakOS — the configuration wizard sets up your company.
                        Your template choice (if any) is remembered for the wizard.
                    </p>
                    <div class="flex flex-wrap gap-3 justify-center">
                        <a href="/setup" class="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-black font-semibold rounded-2xl text-sm">Open setup wizard</a>
                        ${dash}
                    </div>
                </div>
            `;
        }

        function prevStep() {
            if (isInTemplateMode) {
                if (currentPage > 0) {
                    currentPage--;
                    renderPage();
                    return;
                }
            }

            if (currentPage > 0) {
                currentPage--;
                renderPage();
            } else if (currentSectionIndex > 0) {
                currentSectionIndex--;
                loadSection(currentSectionIndex);
            }
        }

        function skipSection() {
            if (currentSectionIndex < sections.length - 1) {
                currentSectionIndex++;
                loadSection(currentSectionIndex);
            }
        }

        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose'
        });

        loadSection(0);
        setupIsComplete().then(applyDashboardLinks);
    </script>
</body>
</html>
