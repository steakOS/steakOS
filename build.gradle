buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://repo.grails.org/grails/restricted'
        }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-bom:$grailsVersion")
        classpath "org.apache.grails:grails-gradle-plugins"
        classpath "org.apache.grails:grails-data-hibernate5"
        classpath "cloud.wondrify:asset-pipeline-gradle"
    }
}

// Product SemVer (VERSIONS.md V6): 0.x until SBM GA → 1.0.0. Source of V for /api/version.
// 0.2.6 = open-source download rules on the one-line installer (PDR-036 / ADR-058)
version = "0.2.6"
group = "steakos"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"war"
apply plugin:"org.apache.grails.gradle.grails-web"
apply plugin:"cloud.wondrify.asset-pipeline"
apply plugin:"org.apache.grails.gradle.grails-gsp"

repositories {
    mavenCentral()
    maven {
        url = 'https://repo.grails.org/grails/restricted'
    }
}

dependencies {
    console "org.apache.grails:grails-console"
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-layout"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.apache.grails:grails-data-hibernate5"
    implementation "org.apache.grails:grails-gsp"
    implementation "org.apache.grails:grails-spring-security:7.1.4"
    // Groovy 4: Date.parse(fmt, str) / format live in groovy-dateutil (not core)
    implementation "org.apache.groovy:groovy-dateutil"
    // AUTH01 QR for otpauth:// enrolment
    implementation "com.google.zxing:core:3.5.3"
    implementation "com.google.zxing:javase:3.5.3"
    // ISO 6422-1 / A4 commercial trade documents (quote, order, PO, invoice)
    implementation "com.github.librepdf:openpdf:1.3.43"
    // NIP-07 event signature verify (secp256k1 schnorr) — JVM API + JNI natives
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jvm:0.17.3"
    implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm:0.17.3"
    integrationTestImplementation testFixtures("org.apache.grails:grails-geb")
    // HTTP E2E (HTTP-E2E-TESTS-CONCEPT D1–D2): Spock + full app boot
    integrationTestImplementation "org.spockframework:spock-core"
    integrationTestImplementation "org.apache.grails:grails-testing-support-web"
    integrationTestImplementation "org.apache.grails:grails-testing-support-datamapping"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-test"
    profile "org.apache.grails.profiles:web"
    runtimeOnly "org.fusesource.jansi:jansi"
    runtimeOnly "org.postgresql:postgresql"
    runtimeOnly "com.zaxxer:HikariCP"
    runtimeOnly "cloud.wondrify:asset-pipeline-grails"
    testAndDevelopmentOnly "org.webjars.npm:bootstrap"
    testAndDevelopmentOnly "org.webjars.npm:bootstrap-icons"
    testAndDevelopmentOnly "org.webjars.npm:jquery"
    testImplementation "org.apache.grails:grails-testing-support-datamapping"
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
}

compileJava.options.release = 17

// GroovyCompile runs in a forked worker; give it enough heap on small machines
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.fork = true
    // Cap below earlyoom 10%-avail threshold on 8Gi lab hosts (2g workers get SIGTERM).
    groovyOptions.forkOptions.memoryMaximumSize = '768m'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// HTTP E2E: use Grails test env → steakos_test (D4). Local-only gate (D9).
tasks.named('integrationTest').configure {
    systemProperty 'grails.env', 'test'
    // Failures should be visible; suite is opt-in (not part of check unless requested)
    outputs.upToDateWhen { false }
}

// ---------------------------------------------------------------------------
// Optional local APM agent — not required for daily ops; never on by default.
// Agent lives in private companion: ../steakOS-dev/tools/glowroot/
// Enable: ./gradlew bootRun -Pglowroot   OR   STEAKOS_GLOWROOT=1 ./gradlew bootRun
// Setup:  ./scripts/setup-glowroot.sh
// ---------------------------------------------------------------------------
def glowrootRequested = project.hasProperty('glowroot') ||
        System.getenv('STEAKOS_GLOWROOT') in ['1', 'true', 'TRUE', 'yes', 'YES']
def glowrootHomeProp = project.findProperty('glowrootHome') ?: System.getenv('STEAKOS_GLOWROOT_HOME')
def glowrootHomeDefault = file("${projectDir}/../steakOS-dev/tools/glowroot")
def glowrootHome = glowrootHomeProp ?
        file(glowrootHomeProp as String) :
        glowrootHomeDefault
def glowrootJar = new File(glowrootHome, 'glowroot.jar')

tasks.named('bootRun').configure {
    if (glowrootRequested) {
        if (!glowrootJar.isFile()) {
            throw new GradleException(
                    "Optional APM requested (-Pglowroot / STEAKOS_GLOWROOT=1) but agent missing:\n" +
                            "  ${glowrootJar}\n" +
                            "Run: ./scripts/setup-glowroot.sh\n" +
                            "(agent path defaults to sibling steakOS-dev/tools/glowroot)")
        }
        jvmArgs "-javaagent:${glowrootJar.absolutePath}"
        doFirst {
            logger.lifecycle("Optional APM enabled → UI http://127.0.0.1:4000  (agent ${glowrootJar})")
        }
    }
}

// OI-V01 — embed build.version + build.time; keep Implementation-Version = project.version on bootJar
tasks.named('bootJar').configure {
    manifest {
        attributes(
                'Implementation-Title'  : 'steakOS',
                'Implementation-Version': project.version.toString()
        )
    }
}
springBoot {
    buildInfo {
        properties {
            // version defaults to project.version; time is recorded at build
        }
    }
}

assets {
    excludes = [
            'webjars/jquery/**',
            'webjars/bootstrap/**',
            'webjars/bootstrap-icons/**'
    ]
    includes = [
            'webjars/jquery/*/dist/jquery.js',
            'webjars/bootstrap/*/dist/js/bootstrap.bundle.js',
            'webjars/bootstrap/*/dist/css/bootstrap.css',
            'webjars/bootstrap-icons/*/font/bootstrap-icons.css',
            'webjars/bootstrap-icons/*/font/fonts/*',
    ]
}

