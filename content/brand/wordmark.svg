<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="steakOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12151a"/>
      <stop offset="1" stop-color="#1a222e"/>
    </linearGradient>
    <linearGradient id="mark-g" x1="28" y1="28" x2="116" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8a3d"/>
      <stop offset="0.55" stop-color="#ff6600"/>
      <stop offset="1" stop-color="#e25500"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="70" x2="680" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8533"/>
      <stop offset="1" stop-color="#ffb078"/>
    </linearGradient>
  </defs>

  <rect width="720" height="160" rx="24" fill="url(#bg)"/>

  <!-- mark -->
  <g transform="translate(36,36)">
    <rect width="88" height="88" rx="22" fill="url(#mark-g)"/>
    <path d="M18 24h52v8H18zm0 16h52v8H18zm0 16h34v8H18z" fill="#fff" fill-opacity="0.96"/>
    <circle cx="64" cy="64" r="11" fill="#171717"/>
    <path d="M59.4 64.2l3.2 3.2 6.6-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="152" y="98" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f4f7fb" letter-spacing="-1.5">steak<tspan fill="url(#accent)">OS</tspan></text>

  <!-- tagline -->
  <text x="156" y="128" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="#9aa7b8" letter-spacing="0.4">Run the business. Keep the keys.</text>
</svg>
